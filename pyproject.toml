[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "OptixProgrammablePasses"
version = "0.1.0"
description = "OptiX ray-tracing passes (depth, IUM, visibility, colour texture, irradiance, indirect, specular cones) exposed to Python"
readme = "README.md"
requires-python = ">=3.9"

# The OptiX SDK location is NOT pinned here on purpose. CMakeLists.txt resolves it
# from -DOptiX_INSTALL_DIR, then the OPTIX_INSTALL_DIR environment variable, then
# the default Windows install path, so this file stays machine-independent:
#
#   OPTIX_INSTALL_DIR="D:/SDKs/OptiX SDK 9.0.0" pip install -e .
#
# To override for a single build without touching the environment:
#
#   pip install -e . -C cmake.define.OptiX_INSTALL_DIR="D:/SDKs/OptiX SDK 9.0.0"

[tool.cibuildwheel]
archs = ["AMD64"]  # 64-bit only on Windows: CUDA and OptiX have no x86 build
